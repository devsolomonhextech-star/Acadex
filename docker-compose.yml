services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schoolos
      POSTGRES_USER: schoolos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolos -d schoolos"]
      interval: 5s
      timeout: 3s
      retries: 10
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: schoolos
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      PGDATABASE: schoolos
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${ACADEX_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-ec", "umask 077; while true; do name=acadex-$$(date -u +%Y%m%dT%H%M%SZ).dump; pg_dump --format=custom --no-owner --no-acl > /backups/$$name.tmp; pg_restore --list /backups/$$name.tmp >/dev/null; mv /backups/$$name.tmp /backups/$$name; find /backups -type f -name 'acadex-*.dump' -mtime +$$BACKUP_RETENTION_DAYS -delete; sleep 86400; done"]
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-development-key-change-before-deploying-0123456789}
      DATABASE_URL: postgresql+asyncpg://schoolos:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/schoolos
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173"]}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-acadex@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schoolos_test
      POSTGRES_USER: schoolos
      POSTGRES_PASSWORD: schoolos-local-test-only
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolos -d schoolos_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  postgres_test_data:
