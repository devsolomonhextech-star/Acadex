services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schoolos
      POSTGRES_USER: schoolos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolos -d schoolos"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-development-key-change-before-deploying-0123456789}
      DATABASE_URL: postgresql+asyncpg://schoolos:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/schoolos
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173"]}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schoolos_test
      POSTGRES_USER: schoolos
      POSTGRES_PASSWORD: schoolos-local-test-only
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolos -d schoolos_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  postgres_test_data:
