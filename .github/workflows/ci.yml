name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Build production frontend
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolos
          POSTGRES_PASSWORD: schoolos-ci-only
          POSTGRES_DB: schoolos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolos -d schoolos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://schoolos:schoolos-ci-only@localhost:5432/schoolos_test
      SECRET_KEY: ci-only-key-not-used-outside-tests-0123456789
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev]'
        working-directory: backend
      - name: Run API tests
        run: python -m pytest
        working-directory: backend
